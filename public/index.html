<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Lista de Compras</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: #20252b;
      background: #f3f5f8;
    }
    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 34px;
      background: #fff;
      border: 1px solid #e5e9ef;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(25, 39, 52, .08);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #5575a5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 30px; }
    .subtitle { margin: 10px 0 26px; color: #697481; line-height: 1.5; }
    form { display: flex; gap: 10px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    .field { flex: 1; min-width: 0; }
    input[type="text"] {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid #cfd6df;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #527bb5; box-shadow: 0 0 0 3px #527bb522; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0 17px;
      background: #315f9c;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #244d82; }
    #mensagem { min-height: 20px; margin: 10px 0 0; color: #b42318; font-size: 13px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; margin-top: 26px; }
    h2 { margin: 0; font-size: 17px; }
    #resumo { color: #697481; font-size: 13px; }
    ul { display: grid; gap: 9px; margin: 15px 0 0; padding: 0; list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 54px;
      padding: 10px 12px;
      border: 1px solid #e5e9ef;
      border-radius: 9px;
    }
    li input { width: 17px; height: 17px; accent-color: #315f9c; }
    .item-nome { flex: 1; overflow-wrap: anywhere; }
    li.concluido .item-nome { color: #89929d; text-decoration: line-through; }
    .remover {
      padding: 7px 10px;
      background: #f1f3f6;
      color: #596575;
      font-size: 12px;
    }
    .remover:hover { background: #e4e8ed; }
    #vazio { margin: 18px 0 0; color: #89929d; text-align: center; font-size: 14px; }
    @media (max-width: 520px) {
      body { padding: 20px 12px; }
      main { padding: 24px 18px; }
      form { flex-direction: column; }
      form button { height: 44px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Organização do dia a dia</p>
    <h1>Minha lista de compras</h1>
    <p class="subtitle">Adicione o que você precisa comprar e marque os itens conforme concluir suas compras.</p>

    <form id="formulario">
      <div class="field">
        <label for="novo-item">Novo item</label>
        <input id="novo-item" name="item" type="text" placeholder="Ex.: Café" autocomplete="off">
      </div>
      <button type="submit">Adicionar</button>
    </form>
    <p id="mensagem" role="alert" aria-live="polite"></p>

    <section aria-labelledby="titulo-lista">
      <div class="list-header">
        <h2 id="titulo-lista">Seus itens</h2>
        <span id="resumo">0 itens · 0 concluídos</span>
      </div>
      <ul id="lista"></ul>
      <p id="vazio">Nenhum item na lista.</p>
    </section>
  </main>

  <script>
    const CHAVE = 'lista-de-compras';
    const formulario = document.querySelector('#formulario');
    const campo = document.querySelector('#novo-item');
    const lista = document.querySelector('#lista');
    const resumo = document.querySelector('#resumo');
    const mensagem = document.querySelector('#mensagem');
    const vazio = document.querySelector('#vazio');

    let itens = carregarItens();

    function carregarItens() {
      try {
        return JSON.parse(localStorage.getItem(CHAVE)) || [];
      } catch {
        return [];
      }
    }

    function salvarItens() {
      localStorage.setItem(CHAVE, JSON.stringify(itens));
    }

    function atualizarTela() {
      lista.replaceChildren();

      itens.forEach((item) => {
        const linha = document.createElement('li');
        if (item.concluido) linha.classList.add('concluido');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.concluido;
        checkbox.setAttribute('aria-label', `Concluir ${item.nome}`);
        checkbox.addEventListener('change', () => {
          item.concluido = checkbox.checked;
          salvarItens();
          atualizarTela();
        });

        const nome = document.createElement('span');
        nome.className = 'item-nome';
        nome.textContent = item.nome;

        const remover = document.createElement('button');
        remover.type = 'button';
        remover.className = 'remover';
        remover.textContent = 'Remover';
        remover.setAttribute('aria-label', `Remover ${item.nome}`);
        remover.addEventListener('click', () => {
          itens = itens.filter((atual) => atual.id !== item.id);
          salvarItens();
          atualizarTela();
        });

        linha.append(checkbox, nome, remover);
        lista.append(linha);
      });

      const total = itens.length;
      const concluidos = itens.filter((item) => item.concluido).length;
      const itemTexto = total === 1 ? 'item' : 'itens';
      const concluidoTexto = concluidos === 1 ? 'concluído' : 'concluídos';
      resumo.textContent = `${total} ${itemTexto} · ${concluidos} ${concluidoTexto}`;
      vazio.hidden = total > 0;
    }

    formulario.addEventListener('submit', (evento) => {
      evento.preventDefault();
      const nome = campo.value.trim();

      if (!nome) {
        mensagem.textContent = 'Digite um item antes de adicionar.';
        campo.focus();
        return;
      }

      mensagem.textContent = '';
      itens.push({ id: Date.now() + Math.random(), nome, concluido: false });
      salvarItens();
      atualizarTela();
      formulario.reset();
      campo.focus();
    });

    atualizarTela();
  </script>
</body>
</html>
